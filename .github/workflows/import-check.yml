name: Import reproducibility check
on:
  push:
    branches: [reproducibility/setup-and-import]
  pull_request:
    paths:
      - 'scripts/**'
      - 'data/raw/DATASET FOR PROJECT.xlsx'
      - '.github/workflows/import-check.yml'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install import dependencies
        run: Rscript --vanilla -e 'install.packages(c("readxl", "dplyr", "stringr", "readr"), repos="https://cloud.r-project.org")'
      - name: Check import from a clean R session
        run: Rscript --vanilla scripts/qc/check_data_import.R
